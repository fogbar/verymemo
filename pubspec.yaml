name: verymemo
description: 'memo app tech'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  # supabase_flutter: ^2.8.3
  # supabase_auth_ui: ^0.5.4

  # Firebase
  firebase_auth: ^5.5.0
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.4
  firebase_messaging: ^15.2.3

  # 로컬 저장소
  shared_preferences: ^2.5.2
  sqflite: ^2.4.2

  # 인증
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 네트워크
  dio: ^5.8.0+1
  # retrofit: ^4.4.2

  # 데이터 바인딩
  freezed: '>=2.5.8 < 3.0.0'
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 라우팅
  go_router: '>=14.0.0 < 16.0.0'

  # 권한 처리
  permission_handler: ^11.3.1

  # 이미지 처리
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  file_picker: ^9.0.2  
  flutter_file_dialog: ^3.0.1
  image: ^4.0.17 
  path_provider: ^2.1.1
  image_picker: ^1.0.7

  # 토스트 메시지
  fluttertoast: ^8.2.12
  intl: ^0.19.0

  #ui
  custom_refresh_indicator: ^2.2.1

  # 에디터
  flutter_quill: '>=9.3.12 <11.0.0-dev.15'
  flutter_quill_extensions: '>=9.3.12 <11.0.0-dev.15'

  # 기타
  device_info_plus: ^10.0.1
  path: ^1.9.0
  smooth_page_indicator: ^1.2.0+3
  flutter_native_splash: ^2.4.4
  crypto: ^3.0.3

  # 링크
  any_link_preview: ^3.0.3
  url_launcher: ^6.2.5

  # 추가
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.4.3
  json_serializable: ^6.9.0
  go_router_builder: ^2.7.5
  sqflite_common_ffi: ^2.3.5
  flutter_launcher_icons: ^0.13.1

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: SUIT
      fonts:
        - asset: assets/fonts/SUIT-Regular.ttf
          weight: 400
        - asset: assets/fonts/SUIT-Medium.ttf
          weight: 500
        - asset: assets/fonts/SUIT-SemiBold.ttf
          weight: 600

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
