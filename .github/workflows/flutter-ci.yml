name: Flutter CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dart SDK 설치 단계 추가
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        run: |
          dart pub global activate fvm
          export PATH="$PATH:$HOME/.pub-cache/bin"

      - name: Install Flutter SDK via FVM
        run: |
          fvm install stable
          fvm use stable
          export PATH="$PATH:`pwd`/.fvm/versions/stable/bin"
          fvm flutter doctor

      - name: Install dependencies
        run: fvm flutter pub get # FVM을 통해 패키지 설치

      - name: Run tests
        run: fvm flutter test # FVM을 통해 테스트 실행

      - name: Build APK
        run: fvm flutter build apk --release # FVM을 통해 APK 빌드

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
